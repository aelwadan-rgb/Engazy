<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق الإنتاجية الشامل - FocusHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #10b981;
            --danger: #ef4444;
            --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 900px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }

        @media (min-width: 500px) {
            .app-container {
                border-radius: 36px;
                height: 88vh;
            }
        }

        .app-header {
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
        }

        .app-title {
            font-size: 20px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
        }

        .app-title i { color: var(--primary); }
        .app-date { font-size: 12px; color: var(--text-secondary); }

        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            position: relative;
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bottom-nav {
            height: 75px;
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
        }

        .nav-item {
            background: transparent;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
            flex: 1;
            padding: 8px 0;
        }

        .nav-item i { font-size: 20px; }
        .nav-item.active { color: var(--primary); transform: translateY(-2px); }

        .timer-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .timer-modes {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px;
            border-radius: 12px;
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-btn.active { background: var(--primary); color: #fff; }

        .timer-display {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 10px 0;
            color: #fff;
            text-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.1s, background 0.3s;
        }

        .btn:active { transform: scale(0.95); }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 12px;
            border-radius: 16px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input, select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            padding: 10px 14px;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            font-family: 'Tajawal', sans-serif;
        }

        input[type="text"] { flex: 1; }
        input:focus, select:focus { border-color: var(--primary); }

        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
        }

        .task-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 12px 14px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
        }

        .task-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .task-meta {
            font-size: 11px;
            color: var(--text-secondary);
            display: flex;
            gap: 8px;
        }

        .task-item.completed .task-info span {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
        }

        .stat-number { font-size: 26px; font-weight: 900; color: var(--accent); margin-bottom: 5px; }
        .stat-label { font-size: 13px; color: var(--text-secondary); }

        .settings-group {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 16px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .setting-item input[type="number"] { width: 70px; text-align: center; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <div class="app-title">
                <i class="fa-solid fa-bolt-lightning"></i> FocusHub
            </div>
            <div class="app-date" id="currentDate"></div>
        </header>

        <main class="app-content">
            <!-- الشاشة الأولى: العداد والتخطيط السريع -->
            <div class="tab-content active" id="tab-timer">
                <div class="timer-card">
                    <div class="timer-modes">
                        <button class="mode-btn active" onclick="switchMode('work', 25)">تركيز</button>
                        <button class="mode-btn" onclick="switchMode('shortBreak', 5)">راحة قصيرة</button>
                        <button class="mode-btn" onclick="switchMode('longBreak', 15)">راحة طويلة</button>
                    </div>
                    <div class="timer-display" id="timerDisplay">25:00</div>
                    <div class="timer-controls">
                        <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">ابدأ</button>
                        <button class="btn btn-secondary" onclick="resetTimer()">إعادة</button>
                    </div>
                </div>

                <div>
                    <div class="section-title"><span>خطتك وجلساتك اليومية</span></div>
                    <div class="input-group">
                        <input type="text" id="taskInput" placeholder="اكتب اسم المهمة اللي هتشتغل عليها...">
                        <div class="input-row">
                            <select id="taskDay">
                                <option value="اليوم">مهمة اليوم</option>
                                <option value="غداً">مهمة غداً (تخطيط مسبق)</option>
                            </select>
                            <input type="number" id="taskDuration" placeholder="بالدقائق" min="1" max="120" value="25" style="flex:1;">
                            <button class="btn btn-primary" onclick="addTask()"><i class="fa-solid fa-plus"></i> إضافة</button>
                        </div>
                    </div>
                    <ul class="task-list" id="taskList" style="margin-top: 12px;"></ul>
                </div>
            </div>

            <!-- الشاشة الثانية: جدول المهام بالكامل -->
            <div class="tab-content" id="tab-tasks">
                <div class="section-title">إدارة مهامك المخططة</div>
                <ul class="task-list" id="fullTaskList"></ul>
            </div>

            <!-- الشاشة الثالثة: الإحصائيات -->
            <div class="tab-content" id="tab-stats">
                <div class="section-title">إحصائيات إنجازك</div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="statMinutes">0</div>
                        <div class="stat-label">دقائق التركيز</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="statCompletedTasks">0</div>
                        <div class="stat-label">مهام مكتملة</div>
                    </div>
                </div>
            </div>

            <!-- الشاشة الرابعة: الإعدادات -->
            <div class="tab-content" id="tab-settings">
                <div class="section-title">إعدادات أوقات المؤقت (بالدقائق)</div>
                <div class="settings-group">
                    <div class="setting-item">
                        <span>وقت التركيز الأساسي:</span>
                        <input type="number" id="setWork" value="25" min="1" max="60" onchange="updateSettings()">
                    </div>
                    <div class="setting-item">
                        <span>الراحة القصيرة:</span>
                        <input type="number" id="setShort" value="5" min="1" max="30" onchange="updateSettings()">
                    </div>
                    <div class="setting-item">
                        <span>الراحة الطويلة:</span>
                        <input type="number" id="setLong" value="15" min="1" max="60" onchange="updateSettings()">
                    </div>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('timer', this)">
                <i class="fa-solid fa-clock"></i>
                <span>العداد</span>
            </button>
            <button class="nav-item" onclick="switchTab('tasks', this)">
                <i class="fa-solid fa-list-check"></i>
                <span>المهام</span>
            </button>
            <button class="nav-item" onclick="switchTab('stats', this)">
                <i class="fa-solid fa-chart-pie"></i>
                <span>الإحصائيات</span>
            </button>
            <button class="nav-item" onclick="switchTab('settings', this)">
                <i class="fa-solid fa-gear"></i>
                <span>الإعدادات</span>
            </button>
        </nav>
    </div>

    <script>
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('ar-EG', {month: 'short', day: 'numeric'});

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            btn.classList.add('active');
        }

        let workTime = 25 * 60;
        let shortBreakTime = 5 * 60;
        let longBreakTime = 15 * 60;
        let currentTime = workTime;
        let timerInterval = null;
        let isRunning = false;
        let currentMode = 'work';

        const timerDisplay = document.getElementById('timerDisplay');
        const startBtn = document.getElementById('startBtn');

        function updateDisplay() {
            const minutes = Math.floor(currentTime / 60);
            const seconds = currentTime % 60;
            timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function switchMode(mode, defaultMins) {
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.textContent = 'ابدأ';
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            if(mode === 'work') currentTime = workTime;
            if(mode === 'shortBreak') currentTime = shortBreakTime;
            if(mode === 'longBreak') currentTime = longBreakTime;
            updateDisplay();
        }

        function toggleTimer() {
            if(isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
                startBtn.textContent = 'استئناف';
            } else {
                isRunning = true;
                startBtn.textContent = 'إيقاف مؤقت';
                timerInterval = setInterval(() => {
                    if(currentTime > 0) {
                        currentTime--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;
                        alert('انتهى وقت الجلسة! بطل ممتاز ✨');
                        startBtn.textContent = 'ابدأ';
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.textContent = 'ابدأ';
            if(currentMode === 'work') currentTime = workTime;
            if(currentMode === 'shortBreak') currentTime = shortBreakTime;
            if(currentMode === 'longBreak') currentTime = longBreakTime;
            updateDisplay();
        }

        function updateSettings() {
            workTime = parseInt(document.getElementById('setWork').value) * 60;
            shortBreakTime = parseInt(document.getElementById('setShort').value) * 60;
            longBreakTime = parseInt(document.getElementById('setLong').value) * 60;
            resetTimer();
        }

        let tasks = JSON.parse(localStorage.getItem('focushub_tasks_v2')) || [];
        let completedCount = parseInt(localStorage.getItem('focushub_completed_v2')) || 0;
        let totalFocusMinutes = parseInt(localStorage.getItem('focushub_focus_mins_v2')) || 0;

        function renderTasks() {
            const list = document.getElementById('taskList');
            const fullList = document.getElementById('fullTaskList');
            list.innerHTML = '';
            fullList.innerHTML = '';

            if(tasks.length === 0) {
                const emptyHTML = `<li class="task-item" style="justify-content: center; color: var(--text-secondary);">لا توجد مهام مضافة بعد ✨</li>`;
                list.innerHTML = emptyHTML;
                fullList.innerHTML = emptyHTML;
                return;
            }

            tasks.forEach((task, index) => {
                const html = `
                    <li class="task-item ${task.completed ? 'completed' : ''}">
                        <div class="task-info">
                            <span>${task.text}</span>
                            <div class="task-meta">
                                <span><i class="fa-regular fa-calendar"></i> ${task.day}</span>
                                <span><i class="fa-regular fa-clock"></i> ${task.duration} دقيقة</span>
                            </div>
                        </div>
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})" style="width:20px; height:20px; cursor:pointer;">
                    </li>
                `;
                list.innerHTML += html;
                fullList.innerHTML += html;
            });

            document.getElementById('statCompletedTasks').textContent = completedCount;
            document.getElementById('statMinutes').textContent = totalFocusMinutes;
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const daySelect = document.getElementById('taskDay');
            const durationInput = document.getElementById('taskDuration');
            
            if(!input.value.trim()) return;

            tasks.push({
                text: input.value.trim(),
                day: daySelect.value,
                duration: durationInput.value || 25,
                completed: false
            });

            input.value = '';
            saveAndRenderTasks();
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            if(tasks[index].completed) {
                completedCount++;
                totalFocusMinutes += parseInt(tasks[index].duration || 25);
            } else {
                completedCount = Math.max(0, completedCount - 1);
                totalFocusMinutes = Math.max(0, totalFocusMinutes - parseInt(tasks[index].duration || 25));
            }
            saveAndRenderTasks();
        }

        function saveAndRenderTasks() {
            localStorage.setItem('focushub_tasks_v2', JSON.stringify(tasks));
            localStorage.setItem('focushub_completed_v2', completedCount);
            localStorage.setItem('focushub_focus_mins_v2', totalFocusMinutes);
            renderTasks();
        }

        renderTasks();
        updateDisplay();
    </script>
</body>
  </html>
